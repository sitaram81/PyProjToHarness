pipeline:
  name: PythonPipeline
  identifier: PythonPipeline
  projectIdentifier: PythonToDocker
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: GitConnect
        build: <+input>
  stages:
    - stage:
        name: PythonDevCiCD
        identifier: PythonDevCiCD
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 1: Installing Dependencies ==="
                      cd python-project
                      pip install -r requirements.txt
                      echo "=== Dependencies Installed! ==="
              - step:
                  type: Run
                  name: Run unit tests
                  identifier: Run_unit_tests
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 2: Running Unit Tests ==="
                      cd python-project
                      pip install -r requirements.txt
                      pytest test_app.py -v
                      echo "=== All 3 Tests Passed! ==="
              - step:
                  type: Run
                  name: Run app and verify
                  identifier: Run_app_and_verify
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 3: Verifying App Works ==="
                      cd python-project
                      pip install -r requirements.txt
                      python -c "from app import app; client = app.test_client(); r = client.get('/'); print(r.get_json()); r = client.get('/health'); print(r.get_json()); print('=== App Verified! ===')"
              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: account.DockerHub
                    repo: sitaram81/python_project
                    tags:
                      - PythonToDock
                    caching: false
                    dockerfile: python-project/Dockerfile
                    context: python-project
              - step:
                  type: Run
                  name: Verify Push
                  identifier: Verify_Push
                  spec:
                    shell: Sh
                    command: |-
                      echo "========================================="
                      echo "  Step 5: Image Pushed Successfully!"
                      echo ""
                      echo "  Image: <+variable.docker_username>/python-harness-app:<+pipeline.sequenceId>"
                      echo "  Image: <+variable.docker_username>/python-harness-app:latest"
                      echo ""
                      echo "  View: https://hub.docker.com/r/<+variable.docker_username>/python-harness-app"
                      echo "========================================="
              - step:
                  type: Run
                  name: Wait Before Cleanup
                  identifier: Wait_Before_Cleanup
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 6: Waiting 1 minute ==="
                      echo "Giving Docker Hub time to process the push..."
                      sleep 60
                      echo "=== Done waiting! Proceeding to cleanup ==="
              - step:
                  type: Run
                  name: Delete and Verify
                  identifier: Delete_and_Verify
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 7: Deleting Docker Hub Image Tag ==="

                      # 1. Log in to get the JWT token
                      TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username":"<+variable.Dockeruser>","password":"<+secrets.getValue("Docker_Passcode")>"}' https://hub.docker.com/v2/users/login/ | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

                      # 2. Delete a specific tag (e.g., 'latest' or a dynamic build tag)
                      # Replace 'latest' with your target tag variable if needed, like <+pipeline.stages.build.spec.tag>
                      TARGET_TAG="PythonToDock"

                      echo "Deleting tag $TARGET_TAG from: <+variable.Dockeruser>/python_project"
                      curl -s -X DELETE \
                        -H "Authorization: JWT $TOKEN" \
                        "https://hub.docker.com/v2/repositories/<+variable.Dockeruser>/python_project/tags/$TARGET_TAG/"

                      echo "=== Tag Deleted! ==="
              - step:
                  type: Run
                  name: Final Verify
                  identifier: Final_Verify
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 8: Final Verification ==="
                        echo ""
                        echo "Checking if repository still exists on Docker Hub..."
                        echo ""
                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hub.docker.com/v2/repositories/<+variable.docker_username>/python_project/)
                        if [ "$STATUS" = "404" ]; then
                          echo "✅ Repository python-harness-app — DELETED (not found)"
                        else
                          echo "⚠️ Repository may still exist (status: $STATUS)"
                        fi
                        echo ""
                        echo "========================================="
                        echo "  ALL DONE!"
                        echo "  Step 1: Dependencies installed ✅"
                        echo "  Step 2: Tests passed ✅"
                        echo "  Step 3: App verified ✅"
                        echo "  Step 4: Image pushed to Docker Hub ✅"
                        echo "  Step 5: Push verified ✅"
                        echo "  Step 6: Waited 1 minute ✅"
                        echo "  Step 7: Image deleted from Docker Hub ✅"
                        echo "  Step 8: Deletion verified ✅"
                        echo "========================================="
